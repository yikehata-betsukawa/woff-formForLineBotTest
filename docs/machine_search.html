<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>センサーデータ検索</title>

    <!-- 相対パスの修正 (環境に合わせて ./css/ または ./docs/css/ に変更してください) -->
    <link rel="stylesheet" href="./css/machine_search.css">

    <script charset="utf-8" src="https://static.worksmobile.net/static/woff/sdk/1.0/sdk.js"></script>
</head>
<body>

<div class="card">
    <h3>🔍 センサーデータ検索</h3>
    
    <!-- 1. 検索モード選択 (ラジオボタン) -->
    <div class="form-group">
        <label>検索モード</label>
        <div class="radio-group">
            <label class="radio-label">
                <input type="radio" name="searchMode" value="latest" checked> ⚡ 最新値
            </label>
            <label class="radio-label">
                <input type="radio" name="searchMode" value="history"> 📈 履歴データ
            </label>
        </div>
    </div>

    <!-- 2. センサー名自由入力 -->
    <div class="form-group">
        <label for="sensorInput">センサー項目名</label>
        <input type="text" id="sensorInput" placeholder="例: 排水処理場 最終沈殿槽 pH" required>
    </div>

    <!-- 3. 日付範囲指定 (履歴モード時のみ表示) -->
    <div id="dateArea" class="form-group" style="display: none;">
        <label for="startDate">開始日</label>
        <input type="date" id="startDate">
        
        <label for="endDate" style="margin-top: 8px;">終了日</label>
        <input type="date" id="endDate">
    </div>

    <button id="searchBtn">検索実行</button>
</div>

<!-- 結果表示カード -->
<div class="card" id="resultCard" style="display: none;">
    <h4>📊 検索結果</h4>
    <div id="resultSummary" class="result-summary"></div>
    <div id="resultContent"></div>
</div>

<!-- JavaScriptの参照パスも確認 (./js/ または ./docs/js/) -->
<script src="./js/machine_search.js"></script>
</body>
</html>
