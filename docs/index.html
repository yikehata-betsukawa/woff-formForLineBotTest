<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOFF 研修用フォーム</title>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="./css/style.css?v=1.0">

  <!-- WOFF SDK (deferを追加して確実に読み込ませる) -->
  <script charset="utf-8" src="https://static.worksmobile.net/static/wm/woff/edge/3.7.4/sdk.js" defer> </script>
</head>
<body>
  <div class="card">
    <h2>研修用 WOFF フォーム</h2>
    <hr>
    
    <!-- エラー・ステータス表示用エリア -->
    <div id="status" class="status-msg">WOFF 初期化中...</div>

    <!-- ユーザー情報表示エリア -->
    <div id="profile" class="profile-container">
      <p>ようこそ、<span id="display-name" class="user-name"></span> さん！</p>
      <p class="sub-info">User ID: <span id="user-id"></span></p>
    </div>
  </div>

  <!-- App Script (deferを追加) -->
  <script src="./js/app.js?v=1.0" defer></script>
</body>
</html>
